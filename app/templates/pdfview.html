<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>{{ title }} — {{ brand }}</title>
<meta name="theme-color" content="#001d3d">
<style>
*{box-sizing:border-box}body{margin:0;background:#525659;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:#001d3d;color:#fff;padding:10px 12px;
  padding-top:max(10px,env(safe-area-inset-top))}
.bar a,.bar button{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:16px;font-weight:600;
  background:#0b3566;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:10px 14px;cursor:pointer;font-family:inherit}
.bar .t{flex:1;min-width:0;font-size:14px;color:#c9d6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .dl{background:#cc2b28;border-color:#cc2b28}
#pages{padding:10px 8px 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
#pages canvas{width:100%;max-width:900px;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.msg{color:#fff;text-align:center;padding:30px 16px;font-size:15px}
</style></head><body>
<div class="bar">
  <a href="{{ back }}" onclick="if(history.length>1&&document.referrer){history.back();return false;}">← Назад</a>
  <span class="t">{{ title }}</span>
  <a class="dl" href="{{ pdf }}" download>Скачать</a>
</div>
<div id="pages"><div class="msg" id="msg">Загружаю документ…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var msg=document.getElementById('msg'), box=document.getElementById('pages');
  if(!window.pdfjsLib){ msg.innerHTML='Не удалось открыть просмотр. <a style="color:#fff" href="{{ pdf }}">Открыть PDF</a>'; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument('{{ pdf }}').promise.then(function(pdf){
    msg.remove();
    var dpr=Math.min(window.devicePixelRatio||1,2), w=Math.min(box.clientWidth-16,900);
    var chain=Promise.resolve();
    for(var i=1;i<=pdf.numPages;i++){(function(n){chain=chain.then(function(){return pdf.getPage(n).then(function(p){
      var v=p.getViewport({scale:1}), sc=w/v.width*dpr, vp=p.getViewport({scale:sc});
      var c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; box.appendChild(c);
      return p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;});});})(i);}
  }).catch(function(){ msg.innerHTML='Не удалось открыть документ. <a style="color:#fff" href="{{ pdf }}">Открыть PDF</a>'; });
})();
</script>
</body></html>
