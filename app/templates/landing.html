<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand }}</title>
<link rel="apple-touch-icon" href="{{ base }}/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ base }}/static/icon-192.png">
<link rel="manifest" href="{{ base }}/manifest.webmanifest">
<meta name="theme-color" content="#cc2b28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЭДО АНЕСКОМ">
<link rel="stylesheet" href="{{ base }}/static/style.css">
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <img class="logo-img" src="{{ base }}/static/logo.png" alt="ANESCOM">
  <div><div class="brand">{{ brand }}</div><div class="sub">{{ company }}</div></div>
</div></header>
<main class="wrap">
  <section class="panel">
    <h2>Портал электронного документооборота</h2>
    <p>Это служебный портал {{ company }} для подписания документов.</p>
    <p class="muted">Чтобы подписать документ, перейдите по персональной ссылке из сообщения WhatsApp.</p>
  </section>
</main>
<footer class="ftr">{{ brand }}</footer>
</body>
</html>
